<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kettara Cards</title>
<style>
  :root { --bg:#ececf0; --card:#f4f4f6; --line:#d3d3da; --ink:#0d0d10; --mute:#8a8a92; --btn:#14395f; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; padding:20px; font:16px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; color:var(--ink);
    background-color:var(--bg);
    background-image:linear-gradient(#dcdce2 1px,transparent 1px),linear-gradient(90deg,#dcdce2 1px,transparent 1px);
    background-size:32px 32px; }
  .card { max-width:720px; margin:0 auto 20px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:40px 44px; }
  .card[hidden] { display:none; }
  h1 { margin:0 0 24px; font-size:26px; font-weight:800; }
  input, select, textarea { width:100%; font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:14px; padding:14px 20px; outline:none; }
  input::placeholder, textarea::placeholder { color:var(--mute); }
  input:focus, select:focus, textarea:focus { border-color:var(--btn); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:18px 0; }
  label { display:block; margin-bottom:8px; color:#3c3c44; }
  .num { font-family:ui-monospace,Menlo,monospace; padding:12px 20px; border-radius:10px; }
  .gap { margin-bottom:18px; }
  textarea { min-height:120px; resize:vertical; margin-bottom:24px; }
  button { width:100%; padding:16px; font-weight:700; font-size:18px; font-family:inherit; color:#fff; background:var(--btn); border:0; border-radius:14px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .msg { margin:14px 0 0; min-height:1.3em; text-align:center; font-size:15px; }
  .msg.ok { color:#1d7a46; } .msg.err { color:#b3261e; }
  @media (max-width:520px){ .card{padding:28px 20px;} .row{grid-template-columns:1fr;} }
</style>
</head>
<body>

<!-- CARD 1: REFLECTION -->
<section class="card" id="card-reflection">
  <h1>Log Daily Reflection</h1>
  <input id="r-headline" placeholder="Headline synthesis of the day...">
  <div class="row">
    <div><label for="r-clarity">Clarity (1–10)</label><input class="num" id="r-clarity" inputmode="decimal" value="9,0"></div>
    <div><label for="r-energy">Energy (1–10)</label><input class="num" id="r-energy" inputmode="decimal" value="8,8"></div>
  </div>
  <input class="gap" id="r-win" placeholder="Primary win of the day...">
  <textarea id="r-lessons" placeholder="Lessons learned & calibration notes..."></textarea>
  <button id="r-go">Commit Journal Entry</button>
  <p class="msg" id="r-msg" role="status"></p>
</section>

<!-- CARD 2: TASKS -->
<section class="card" id="card-tasks">
  <h1>Add Task</h1>
  <input id="t-task" placeholder="What needs to get done...">
  <div class="row">
    <div><label for="t-priority">Priority</label>
      <select id="t-priority"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
    <div><label for="t-due">Due date</label><input id="t-due" type="date"></div>
  </div>
  <textarea id="t-note" placeholder="Notes..."></textarea>
  <button id="t-go">Add to Tasks</button>
  <p class="msg" id="t-msg" role="status"></p>
</section>

<script>
  // ONE SETTING TO EDIT:
  // '' = the API lives on the same site (Vercel).
  // If this file is on GitHub Pages, put your Vercel URL here, e.g. 'https://kettara-api.vercel.app'
  const API_BASE = '';

  const $ = id => document.getElementById(id);
  const num = v => parseFloat(String(v).replace(',', '.'));

  // Show one card via ?card=reflection or ?card=tasks. No parameter shows both.
  const which = new URLSearchParams(location.search).get('card');
  if (which === 'reflection') $('card-tasks').hidden = true;
  if (which === 'tasks') $('card-reflection').hidden = true;

  async function send(type, data, msg, btn, onOk) {
    btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Saving...';
    try {
      const r = await fetch(API_BASE + '/api/save', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, ...data })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'Request failed');
      msg.className = 'msg ok'; msg.textContent = 'Saved to Notion.'; onOk();
    } catch (e) { msg.className = 'msg err'; msg.textContent = 'Not saved: ' + e.message; }
    btn.disabled = false;
  }

  $('r-go').onclick = () => {
    const d = { headline: $('r-headline').value.trim(), clarity: num($('r-clarity').value), energy: num($('r-energy').value),
                win: $('r-win').value.trim(), lessons: $('r-lessons').value.trim() };
    const m = $('r-msg');
    if (!d.headline) { m.className = 'msg err'; m.textContent = 'Add a headline first.'; return; }
    if (isNaN(d.clarity) || isNaN(d.energy)) { m.className = 'msg err'; m.textContent = 'Clarity and Energy must be numbers.'; return; }
    send('reflection', d, m, $('r-go'), () => ['r-headline', 'r-win', 'r-lessons'].forEach(i => $(i).value = ''));
  };

  $('t-go').onclick = () => {
    const d = { task: $('t-task').value.trim(), priority: $('t-priority').value, due: $('t-due').value, note: $('t-note').value.trim() };
    const m = $('t-msg');
    if (!d.task) { m.className = 'msg err'; m.textContent = 'Write the task first.'; return; }
    send('tasks', d, m, $('t-go'), () => ['t-task', 't-note', 't-due'].forEach(i => $(i).value = ''));
  };
</script>
</body>
</html>
